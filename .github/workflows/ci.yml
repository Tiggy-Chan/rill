name: CI

# macOS minutes on a private repo are billed at a higher rate, so only main is built.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: JOBS=3 ./Scripts/test.sh

      - name: Build app
        run: JOBS=3 ./Scripts/build.sh

      - name: Check bundle
        run: |
          plutil -lint build/Rill.app/Contents/Info.plist
          entitlements=$(codesign -d --entitlements - build/Rill.app 2>/dev/null)
          grep -q com.apple.security.app-sandbox <<< "$entitlements"
          ls build/Rill.app/Contents/Resources/*.lproj >/dev/null
